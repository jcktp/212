[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
common = { package = "two-one-two-common", path = "crates/common" }
config = { package = "two-one-two-config", path = "crates/config" }
inference = { package = "two-one-two-inference", path = "crates/inference" }
models = { package = "two-one-two-models", path = "crates/models" }
providers = { package = "two-one-two-providers", path = "crates/providers" }
runtime = { package = "two-one-two-runtime", path = "crates/runtime" }
tui = { package = "two-one-two-tui", path = "crates/tui" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
toml_edit = "0.25"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "fs", "io-util", "signal", "net"] }
tokio-util = "0.7"
futures = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "stream", "json", "http2"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
directories = "6"
ratatui = "0.30"
crossterm = { version = "0.29", features = ["event-stream"] }
unicode-width = "0.2"
sha2 = "0.10"
hex = "0.4"
sysinfo = { version = "0.40", default-features = false, features = ["system", "disk"] }
clap = { version = "4", features = ["derive"] }
tempfile = "3"
rand = "0.9"
zip = { version = "2", default-features = false, features = ["deflate"] }
ignore = "0.4"
time = { version = "0.3", features = ["formatting", "local-offset", "macros"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
opt-level = 3

[profile.dev.package."*"]
opt-level = 1
